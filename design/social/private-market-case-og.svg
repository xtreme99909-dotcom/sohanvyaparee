<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Private-market product concept by SP Studios</title>
  <desc id="desc">Designing trust before disclosure.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8c691" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8c691" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#101a16"/>
  <rect width="1200" height="630" fill="#ffffff" filter="url(#grain)" opacity="0.65"/>
  <rect x="846" width="354" height="630" fill="#e8c691"/>
  <rect x="846" width="354" height="630" fill="#5a3d20" filter="url(#grain)" opacity="0.28"/>

  <path d="M48 44h44M70 22v44M48 586h44M70 564v44" stroke="#e8c691" stroke-opacity="0.7"/>
  <path d="M1106 44h44M1128 22v44M1106 586h44M1128 564v44" stroke="#173a30" stroke-opacity="0.65"/>
  <line x1="70" y1="96" x2="70" y2="516" stroke="#e8c691" stroke-opacity="0.5"/>
  <line x1="98" y1="468" x2="808" y2="468" stroke="#e8c691" stroke-opacity="0.28"/>
  <rect x="98" y="467" width="230" height="3" fill="#e8c691"/>

  <text x="98" y="93" fill="#e8c691" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">INDEPENDENT SPECULATIVE PRODUCT STUDY</text>
  <text x="98" y="215" fill="#f3eee3" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-3.8">
    <tspan x="98" dy="0">Designing trust</tspan>
    <tspan x="98" dy="99" fill="#e8c691" font-style="italic">before disclosure.</tspan>
  </text>
  <text x="98" y="518" fill="#f3eee3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" letter-spacing="2">VERIFY → QUALIFY → REVEAL → COLLABORATE</text>
  <text x="98" y="567" fill="#b8bdb8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">SP STUDIOS · SOHAN VYAPAREE</text>

  <circle cx="1020" cy="166" r="184" fill="url(#glow)"/>
  <circle cx="1020" cy="166" r="119" fill="none" stroke="#173a30" stroke-opacity="0.34"/>
  <circle cx="1020" cy="166" r="78" fill="none" stroke="#173a30" stroke-opacity="0.55"/>
  <circle cx="1020" cy="166" r="51" fill="#173a30"/>
  <text x="1020" y="181" text-anchor="middle" fill="#e8c691" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-style="italic">P</text>

  <text x="896" y="345" fill="#173a30" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="750" letter-spacing="2.8">PRIVATE MARKET SYSTEM</text>
  <text x="896" y="392" fill="#173a30" font-family="Georgia, 'Times New Roman', serif" font-size="34">Progressive</text>
  <text x="896" y="429" fill="#173a30" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">access by design.</text>
  <line x1="896" y1="470" x2="1139" y2="470" stroke="#173a30" stroke-opacity="0.28"/>
  <g fill="#173a30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">
    <text x="914" y="505">01 · MEMBER VERIFIED</text>
    <text x="914" y="534">02 · MANDATE ALIGNED</text>
    <text x="914" y="563">03 · ACCESS CONTROLLED</text>
  </g>
  <g fill="#173a30">
    <circle cx="898" cy="501" r="4"/><circle cx="898" cy="530" r="4"/><circle cx="898" cy="559" r="4"/>
  </g>
